[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "precatorios-cleaner"
version = "0.1.0"
description = "Limpeza e conciliação de dados de precatórios"
requires-python = ">=3.10"
dependencies = [
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.scripts]
precatorios-cleaner = "precatorios.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
